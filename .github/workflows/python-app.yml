name: Set up Java, uses: actions/setup-java@v4, with: distribution: temurin, java-version: '17', - name: Build APK, run: |, if, then chmod +x ./gradlew ./gradlew assembleDebug else echo "ERROR: gradlew file not found" exit 1 fi, - name: Upload APK, uses: actions/upload-artifact@v4, with: name: PyMessenger-APK, path: app/build/outputs/apk/debug/*.apk, if-no-files-found: error.





