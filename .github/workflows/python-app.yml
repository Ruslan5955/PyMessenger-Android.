name: Build PyMessenger APK
'on':
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest.
steps:
uses: actions/checkout@v4, - name: Set up Java, uses: actions/setup-java@v4, with: distribution: temurin, java-version: '17', - name: Build APK, run: |, iflew" ] then, chmod +x ./gradlew, ./gradlew assembleDebug, else, echo "Gradle project not found: gradlew is missing", exit 1, fi, - name: Upload APK, uses: actions/upload-artifact@v4, with: name: PyMessenger-APK, path: app/build/outputs/apk/debug/*.apk.
