name: Build PyMessenger for Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, x86 ]
    steps:
      # The repository name ends in a dot, which Windows cannot use as a folder name.
      - name: Download source
        shell: pwsh
        working-directory: D:\a
        run: git clone --depth 1 https://github.com/Ruslan5955/PyMessenger-Android..git pymessenger-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install build dependencies
        working-directory: D:\a\pymessenger-src
        run: python -m pip install --upgrade pip Flask pyinstaller

      - name: Package Windows executable
        working-directory: D:\a\pymessenger-src
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name PyMessenger --add-data "templates;templates" --add-data "static;static" app.py
          @"
          PyMessenger for Windows ${{ matrix.arch }}

          1. Extract this ZIP to a folder you can write to.
          2. Double-click PyMessenger.exe.
          3. The messenger should open in your browser automatically.
          4. If it does not, open http://127.0.0.1:5000 manually.
          5. Keep the black console window open while using the messenger.
          6. Create an account with your phone number and a password.

          Your local database and uploaded files are saved under:
          %LOCALAPPDATA%\PyMessenger

          This is a local Windows build. It does not by itself publish the messenger to the internet or provide a shared online server.
          "@ | Set-Content -Encoding utf8 dist\README-Windows.txt
          Compress-Archive -Path dist\PyMessenger.exe,dist\README-Windows.txt -DestinationPath dist\PyMessenger-Windows-${{ matrix.arch }}.zip -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMessenger-Windows-${{ matrix.arch }}
          path: D:\a\pymessenger-src\dist\PyMessenger-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: D:\a\pymessenger-src\dist\PyMessenger-Windows-${{ matrix.arch }}.zip
          generate_release_notes: true
