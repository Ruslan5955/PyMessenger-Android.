buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.messenger.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.messenger.pro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // Produces an installable Release APK for direct testing/distribution.
            // For a Play Store release, replace this with a private release keystore.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'android/app/src/main/AndroidManifest.xml'
            java.srcDirs = ['android/app/src/main/java']
            res.srcDirs = ['android/app/src/main/res']
            assets.srcDirs = []
        }
    }
}
