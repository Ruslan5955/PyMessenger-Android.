buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Подключаем стабильную версию плагина сборщика Android
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Применяем плагин приложения
apply plugin: 'com.android.application'

android {
    namespace 'com.messenger.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.messenger.pro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Принудительно заставляем Gradle брать только наш манифест и код
    sourceSets {
        main {
            manifest.srcFile 'android/app/src/main/AndroidManifest.xml'
            java.srcDirs = ['android/app/src/main/java']
            res.srcDirs = []
            assets.srcDirs = []
        }
    }
}
