<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Life and Lion</title>
  <style>
    body { background-color: #070c10; color: #e9edef; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #0b141a; padding: 30px; border-radius: 12px; text-align: center; width: 100%; max-width: 360px; border: 1px solid #2f3b43; }
    h1 { color: #FFD700; margin: 0 0 10px 0; }
    input { width: 100%; padding: 12px; margin: 10px 0; background: #15202b; border: 1px solid #2f3b43; border-radius: 6px; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #FFD700; border: none; border-radius: 6px; color: #070c10; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .tabs a { color: #8696a0; text-decoration: none; margin: 0 10px; font-weight: bold; }
    .tabs a.active { color: #FFD700; border-bottom: 2px solid #FFD700; }
  </style>
</head>
<body>
<div class="card">
  <h1>🦁 LIFE AND LION</h1>
  <div class="tabs" style="margin-bottom: 20px;">
    <a class="active" href="{{ url_for('login') }}">Вход / Регистрация</a>
  </div>
  <form method="post" action="{{ url_for('login') }}">
    <input type="tel" name="phone" placeholder="Номер телефона" required>
    <input type="password" name="password" placeholder="Пароль" required>
    <button type="submit">ПРОДОЛЖИТЬ</button>
  </form>
</div>
</body>
</html>
